name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace --no-daemon > build.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -n 80 build.log
          exit 0

      - name: Publish results to ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cp build.log ci-out/ || true
          grep -n -E "error:|warning: \[|FAILURE|BUILD (SUCCESSFUL|FAILED)|What went wrong|Exception" build.log | head -n 400 > ci-out/summary.txt || true
          echo "commit=${GITHUB_SHA}" > ci-out/status.txt
          echo "exit=${{ steps.build.outputs.exit }}" >> ci-out/status.txt
          if ls build/libs/*.jar >/dev/null 2>&1; then cp build/libs/*.jar ci-out/; fi
          cd ci-out
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI result for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Fail if build failed
        if: steps.build.outputs.exit != '0'
        run: exit 1

      - name: Release jar
        if: steps.build.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -E -- '-(sources|javadoc)\.jar$' | head -n 1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "ブスコハンター（Forge 26.3）最新ビルド" --notes "Minecraft 26.3 + Forge 66.1.0 用。mods フォルダに入れるだけで動きます。commit ${GITHUB_SHA}"

name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace --no-daemon > build.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -n 80 build.log
          exit 0

      - name: Dump Minecraft sources (when .ci/dump-sources exists)
        if: hashFiles('.ci/dump-sources') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find .gradle/mavenizer -maxdepth 8 -name "*.jar" | head -50
          mkdir -p dump
          for j in $(find .gradle/mavenizer ~/.gradle/caches -name "*sources*.jar" 2>/dev/null | grep -i -E "forge|minecraft" | head -5); do cp "$j" dump/; done
          ls -la dump
          cd dump
          git init -q -b sources-dump
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "sources dump" || true
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sources-dump || true

      - name: Server self-test
        id: selftest
        if: steps.build.outputs.exit == '0' && hashFiles('.ci/skip-tests') == ''
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          set +e
          BH_SELFTEST=true timeout 1500 ./gradlew runServer --no-daemon > server.log 2>&1
          echo "server exit $?"
          if grep -q "\[SELFTEST\] RESULT OK" server.log; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
          grep -n -E "SELFTEST|ERROR|Exception|Caused by|WARN.*buskohunter" server.log | head -n 400
          exit 0

      - name: Client auto-test (software rendering)
        id: clienttest
        if: steps.selftest.outputs.ok == '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick mesa-utils libgl1-mesa-dri mesa-vulkan-drivers libegl1 > /dev/null
          mkdir -p run/saves shots
          rm -rf run/saves/bhtest
          cp -r run/world run/saves/bhtest
          rm -f run/saves/bhtest/session.lock
          printf "onboardAccessibility:false\ntutorialStep:none\nrenderDistance:6\nsimulationDistance:6\nskipMultiplayerWarning:true\njoinedFirstServer:true\nnarrator:0\n" > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          xvfb-run -a -s "-screen 0 854x480x24" bash -c '
            (i=0; while true; do sleep 3; i=$((i+1)); import -window root -quality 70 shots/shot_$(printf %03d $i).jpg 2>/dev/null; done) &
            SHOTS=$!
            BH_AUTOTEST=true timeout 2100 ./gradlew runClient --no-daemon > client.log 2>&1
            echo "client exit $?"
            kill $SHOTS
          '
          if grep -q "\[AUTOTEST\].*RESULT DONE" client.log; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
          grep -n -E "AUTOTEST|ERROR|Exception|Caused by|buskohunter" client.log | head -n 300
          exit 0

      - name: Publish results to ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cp build.log ci-out/ || true
          cp server.log ci-out/ 2>/dev/null || true
          cp client.log ci-out/ 2>/dev/null || true
          mkdir -p ci-out/shots && cp shots/*.jpg ci-out/shots/ 2>/dev/null || true
          mkdir -p ci-out/exact
          for f in run/screenshots/bh_*.png; do [ -f "$f" ] && convert "$f" -quality 85 "ci-out/exact/$(basename "${f%.png}").jpg"; done || true
          grep -n -E "AUTOTEST|ERROR|Exception|Caused by|buskohunter" client.log 2>/dev/null | head -n 800 > ci-out/client_summary.txt || true
          grep -n -E "SELFTEST|ERROR|Exception|Caused by|WARN.*buskohunter" server.log 2>/dev/null | head -n 600 > ci-out/server_summary.txt || true
          grep -n -E "error:|warning: \[|FAILURE|BUILD (SUCCESSFUL|FAILED)|What went wrong|Exception" build.log | head -n 400 > ci-out/summary.txt || true
          echo "commit=${GITHUB_SHA}" > ci-out/status.txt
          echo "exit=${{ steps.build.outputs.exit }}" >> ci-out/status.txt
          echo "selftest=${{ steps.selftest.outputs.ok }}" >> ci-out/status.txt
          echo "clienttest=${{ steps.clienttest.outputs.ok }}" >> ci-out/status.txt
          if ls build/libs/*.jar >/dev/null 2>&1; then cp build/libs/*.jar ci-out/; fi
          cd ci-out
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI result for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Fail if build failed
        if: steps.build.outputs.exit != '0'
        run: exit 1

      - name: Release jar
        if: steps.build.outputs.exit == '0' && steps.selftest.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -E -- '-(sources|javadoc)\.jar$' | head -n 1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "ブスコハンター（Forge 26.3）最新ビルド" --notes "Minecraft 26.3 + Forge 66.1.0 用。mods フォルダに入れるだけで動きます。commit ${GITHUB_SHA}"
